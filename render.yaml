services:
  - type: web
    name: aspire-face
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python server.py --download-models
    startCommand: gunicorn server:app --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EMBED_MODEL          # free tier = 512 MB: use the small model there
        value: mbf
      - key: DET_SIDE
        value: "640"
      - key: FAR_BUDGET_S         # the wide search for distant faces is slow on the free CPU: cap it
        value: "3"
      - key: FULL_SIDE
        value: "1280"
      - key: DEFAULT_ROTATE       # glasses frames arrive sideways; try this rotation first (see the ESP32 notes)
        value: "90"
      - key: NOTIFY_UNKNOWN       # also send the photo to Telegram when a face is NOT recognised
        value: "1"
      - key: API_KEY
        generateValue: true
      - key: FIREBASE_URL         # https://<your-project>-default-rtdb.firebaseio.com
        sync: false
      - key: FIREBASE_AUTH        # optional
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false