const $ = id => document.getElementById(id);

if (params.get('key')) localStorage.setItem('aspire_key', params.get('key'));

function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
function node(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'X-API-Key': $('key').value.trim() }, opts.headers || {});

  if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
  return j;
}

function formWith(fileEl, extra) {
  const fd = new FormData();
  fd.append('image', fileEl.files[0]);
  fd.append('rotate', $('rotate').value);

  fd.append('annotate', '1');

  else {
    out.appendChild(node('p', 'say ' + (j.known ? 'known' : 'unknown'), j.say));
    out.appendChild(node('div', 'meta', j.faces + ' face(s) · best score ' + j.score + ' (threshold ' + (j.threshold ?? '-') + ') · margin ' + (j.margin ?? '-') + ' · ' + j.ms + ' ms · rotation ' + j.rotation_used));
    if (j.far_search) out.appendChild(node('div', 'meta', 'Small / distant face: found by the wide search, so treat the score with more care.'));
    if (!j.faces && j.image) out.appendChild(node('div', 'meta', 'Searched (' + j.searched + ') a ' + j.image + ' image; the smallest face I accept is ' + j.min_face_px + ' px.'));
    if (j.persona_text) out.appendChild(node('div', '', j.persona_text));
    if (j.candidates && j.candidates.length) {
      out.appendChild(node('div', 'meta', 'Closest: ' + j.candidates.map(c => c.name + ' ' + c.score).join(' · ')));
    }
    showAnnotated(out, j.annotated);
    const raw = Object.assign({}, j); delete raw.annotated;
    out.appendChild(node('pre', '', JSON.stringify(raw, null, 2)));
  }
  $('idBtn').disabled = false;
};

$('reload').onclick = () => { refreshPeople(); refreshStatus(); };
refreshStatus();
if ($('key').value) refreshPeople();
</script>
</body>
